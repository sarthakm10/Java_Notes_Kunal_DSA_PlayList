<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java + DSA Study</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 21l4-10 4 10m-6.5-3.5h5M21 11v10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="web/app.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn only-mobile" id="menu-btn" aria-label="Show sidebar">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#/roadmap"><span class="logo">J</span><span>Java + DSA <em>Study</em></span></a>
  <nav class="tabs" aria-label="Views">
    <a href="#/roadmap" data-view="roadmap"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Roadmap</span></a>
    <a href="#/practice" data-view="practice"><svg viewBox="0 0 24 24"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M13.5 6l-3 12"/></svg><span>Practice</span></a>
  </nav>
  <div class="top-progress" id="top-progress"></div>
  <button class="icon-btn" id="progress-btn" aria-label="Save or load progress" title="Save or load progress">
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg></button>
  <button class="icon-btn" id="theme-btn" aria-label="Switch light/dark theme" title="Light / dark">
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"><p class="muted pad">Loading…</p></main>
</div>
<div class="backdrop" id="backdrop"></div>

<dialog id="progress-dialog">
  <form method="dialog">
    <h2>Your progress</h2>
    <p>Ticks are saved in this browser for this address (<code id="origin"></code>). Save a copy to a file now and then, and commit it if you like.</p>
    <p id="progress-summary" class="muted"></p>
    <div class="row-btns">
      <button type="button" id="export-btn" class="btn primary">Download progress file</button>
      <label class="btn">Load progress file<input type="file" id="import-file" accept="application/json,.json" hidden></label>
    </div>
    <p id="import-msg" class="muted"></p>
    <div class="row-btns end"><button class="btn">Close</button></div>
  </form>
</dialog>

<script src="web/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="web/app.js"></script>
</body>
</html>
